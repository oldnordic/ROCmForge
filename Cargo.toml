[package]
name = "rocmforge"
version = "0.1.0"
edition = "2021"
description = "AMD-first LLM inference engine for Qwen2.5"
license = "GPL-3.0-only"

[dependencies]
# GGUF loading
memmap2 = "0.9"
half = "2"
# Tokenizer
regex = "1"
once_cell = "1"
bytes = "1"
# Error handling
thiserror = "2"
# Parallelism
rayon = "1"
parking_lot = "0.12"
# Hardware detection
sysinfo = "0.38"
# FFI
libc = "0.2"
# Compile HIP kernels
cc = "1.0"
# Timestamp generation
chrono = "0.4"
# JSON parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cache directory
dirs = "5"
# UUID for API responses
uuid = { version = "1", optional = true, features = ["v4"] }
# HTTP server (optional)
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.5", features = ["trace"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
default = []
# GPU support requires ROCm/HIP installation
gpu = []
# HTTP server with OpenAI-compatible API
server = ["dep:tokio", "dep:axum", "dep:tower", "dep:tower-http", "dep:tokio-stream", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]

[dev-dependencies]
fastrand = "2"
tempfile = "3"
serial_test = "3"
criterion = "0.5"
clap = { version = "4.5", features = ["derive"] }
# For numerical comparisons in kernel correctness tests
approx = "0.5"

# Test configuration notes:
# - GPU tests should ALWAYS be run with: --test-threads=1
# - This prevents VRAM conflicts between concurrent tests
# - Example: cargo test --features gpu -- --test-threads=1
# - The serial_test crate ensures test-level serialization, but single-threaded
#   execution provides additional safety for VRAM management

[[bin]]
name = "rocmforge"
path = "src/main.rs"

[[bin]]
name = "bench_gemv"
path = "src/bench_gemv.rs"

[[bin]]
name = "rocmforge-convert"
path = "src/bin/convert.rs"

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "gpu_decode"
harness = false
required-features = ["gpu"]

[[bench]]
name = "kernel_performance"
harness = false
required-features = ["gpu"]

[[bench]]
name = "batched_fused_gate_up"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_prefill_layer"
harness = false
required-features = ["gpu"]

[[bench]]
name = "portable_dp4a"
harness = false
required-features = ["gpu"]

[[bench]]
name = "q6_k_decode"
harness = false
required-features = ["gpu"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
